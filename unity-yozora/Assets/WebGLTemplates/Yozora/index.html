<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>SAO 夜空 · Unity</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#080b12;color:#dce9ff;font:14px system-ui;height:100%}body{display:flex;flex-direction:column;align-items:center}.stage{position:relative;flex:1;min-height:0;width:100%;display:flex;justify-content:center}canvas{display:block;height:100%;width:auto;max-width:100%;aspect-ratio:640/1120;background:#080b12}#loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#080b12;font-size:18px;line-height:2}#loading small{font-size:12px;color:#a0abc0}#controls{width:min(760px,100%);padding:8px;display:flex;justify-content:center;gap:7px;flex-wrap:wrap}button,select{background:#17243b;border:1px solid #516682;color:#e7f1ff;border-radius:5px;padding:10px 13px;font:inherit;cursor:pointer}button:hover{background:#293c60}button:disabled{opacity:.5}button:focus-visible,select:focus-visible{outline:2px solid #b2e4ff;outline-offset:2px}#note{color:#8292ad;font-size:10px;text-align:center;padding:0 8px 8px}#telemetry{display:none}#error{color:#ffb4a9;max-width:80vw;font-size:13px;white-space:pre-wrap}#resetDialog{background:#142137;color:white;border:1px solid #63728c;border-radius:8px}#resetDialog::backdrop{background:#000b}@media(max-width:480px){button,select{font-size:12px;padding:9px 10px}#controls{gap:5px}}
.compact-control{display:flex;align-items:center;gap:6px;font-size:11px;color:#afc1db}.compact-control select{padding:8px}.compact-control input{width:75px}</style></head><body><div class="stage"><canvas id="unity-canvas" tabindex="0" aria-label="Unity SAO 夜空の遊技台"></canvas><div id="loading">UNITY<br>夜空を準備しています<small id="progress">0%</small><p id="error"></p></div></div><div id="controls"><button data-command="fire" id="fire" disabled>発射開始</button><button data-command="pause" id="pause" disabled>一時停止</button><button data-command="supply" disabled>250玉補給</button><button data-command="push" disabled>PUSH</button><button data-command="structure" disabled>装飾 表示／非表示</button><button data-command="angle" disabled>斜めから見る</button><button data-command="sound" id="sound" disabled>音 OFF</button><button id="reset" disabled>リセット</button><label class="compact-control">視点 <select id="model-view" aria-label="モデルの表示箇所" disabled><option value="front">全体・正面</option><option value="angle">全体・斜め</option><option value="lcd">液晶・演出</option><option value="fair">FAIR接写</option><option value="right">右通路・開閉部</option><option value="controls">下皿・操作部</option></select></label><select id="demo" aria-label="試演シーン" disabled><option value="">試演シーン</option><option value="win">封印突破・当り</option><option value="miss">封印突破・外れ</option><option value="bonus">初当り300玉</option><option value="decision">次の戦いへ・1500玉</option><option value="rush-reach">RUSH・封印突破</option><option value="rush">ST53回</option><option value="wou">上位ST70回</option><option value="awakening">AWAKENING表示</option><option value="upper-result">上位RESULT表示</option><option value="drive">SWORD DRIVE</option><option value="zero">0図柄・表示試演</option><option value="eight">8図柄・表示試演</option></select><label class="compact-control">試演速度 <select title="4倍・8倍の試演中は音声を停止します" id="preview-rate" aria-label="試演速度" disabled><option value="1">1×</option><option value="4">4×</option><option value="8">8×</option></select></label><label class="compact-control">音量 <input id="volume" aria-label="効果音とBGMの音量" type="range" min="0" max="1" step="0.05" value="0.65" disabled></label></div><div id="note">初期表示は釘・球路を確認する構造表示 / 装飾は切替可能 / 試演選択は遊技をリセット</div><output id="telemetry"></output><dialog id="resetDialog"><p>この台の持ち玉と遊技記録を初期化します。</p><button id="confirmReset">リセットする</button><button id="cancelReset">キャンセル</button></dialog><script>
let unity=null,sound=false;const canvas=document.querySelector('canvas');
function send(c){if(unity){canvas.focus({preventScroll:true});unity.SendMessage('YozoraMachine','Command',c);}}
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent||e.data?.type!=='yozora-view')return;const v=e.data.view;if(['front','angle','fair','right','controls','lcd'].includes(v))send('view:'+v);});
function updateState(s){document.querySelector('#model-view').value=s.view||'front';document.querySelector('#fire').textContent=s.autoFire?'発射停止':'発射開始';document.querySelector('#pause').textContent=s.paused?'再開':'一時停止';document.querySelector('[data-command="angle"]').textContent=s.view==='angle'?'正面に戻す':'斜めから見る';document.querySelector('#preview-rate').disabled=!s.demo;document.querySelector('#preview-rate').value=String(s.previewRate||1);document.querySelector('#sound').textContent='音 '+(s.soundEnabled?'ON':'OFF');sound=!!s.soundEnabled;const volume=document.querySelector('#volume');if(document.activeElement!==volume&&Number.isFinite(s.volume))volume.value=String(s.volume);document.querySelector('[data-command="push"]').disabled=!!s.paused;document.body.dataset.ready='true';}
new MutationObserver(()=>{try{updateState(JSON.parse(document.querySelector('#telemetry').textContent));}catch{}}).observe(document.querySelector('#telemetry'),{childList:true,characterData:true,subtree:true});
document.querySelectorAll('[data-command]').forEach(b=>b.onclick=()=>{send(b.dataset.command);});
document.querySelector('#model-view').onchange=e=>send('view:'+e.target.value);
document.querySelector('#volume').oninput=e=>send('volume:'+e.target.value);document.querySelector('#preview-rate').onchange=e=>send('preview-rate:'+e.target.value);
document.querySelector('#demo').onchange=e=>{if(e.target.value){send('demo-'+e.target.value);e.target.value='';}};
document.querySelector('#reset').onclick=()=>document.querySelector('#resetDialog').showModal();document.querySelector('#cancelReset').onclick=()=>document.querySelector('#resetDialog').close();document.querySelector('#confirmReset').onclick=()=>{send('reset');document.querySelector('#resetDialog').close();};
const script=document.createElement('script');script.src='Build/{{{ LOADER_FILENAME }}}';script.onerror=()=>document.querySelector('#error').textContent='Unityローダーの読み込みに失敗しました。再読み込みしてください。';script.onload=()=>createUnityInstance(canvas,{dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',streamingAssetsUrl:'StreamingAssets',companyName:'Silverball Chronicles',productName:'SAO Yozora Unity Prototype',productVersion:'0.1.0',autoSyncPersistentDataPath:true,matchWebGLToCanvasSize:true,devicePixelRatio:Math.min(window.devicePixelRatio||1,2)},p=>document.querySelector('#progress').textContent=Math.round(p*100)+'%').then(instance=>{unity=instance;parent.postMessage({type:'yozora-ready'},location.origin);document.querySelector('#loading').remove();document.querySelectorAll('button,select,input').forEach(b=>b.disabled=false);}).catch(e=>document.querySelector('#error').textContent='Unityの起動に失敗しました。\n'+String(e));document.body.appendChild(script);
</script></body></html>
