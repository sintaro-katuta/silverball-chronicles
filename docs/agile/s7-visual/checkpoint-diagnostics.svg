<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200"><rect width="1200" height="1200" fill="#081827"/><style>text{font-family:Hiragino Sans,Noto Sans JP,sans-serif;fill:#edf5fc}</style><text x="65" y="80" font-size="38" font-weight="bold">#11 失敗の判定を保ち、調査材料を残す</text><text x="65" y="125" font-size="23" fill="#bed1e0">説明設計案／実行結果ではありません</text><rect x="65" y="180" width="1070" height="145" rx="12" fill="#153249" stroke="#647d91"/><text x="95" y="229" font-size="31" font-weight="bold">1. 既存の公開後確認</text><text x="95" y="281" font-size="26">成功・失敗の判定、待機時間は変更しない</text><path d="M600 333v42m-10-10 10 10 10-10" stroke="#83b6cc" stroke-width="3" fill="none"/><rect x="65" y="390" width="1070" height="145" rx="12" fill="#153249" stroke="#647d91"/><text x="95" y="439" font-size="31" font-weight="bold">2. 失敗時だけ診断を保存</text><text x="95" y="491" font-size="26">HTTP・URL・通信エラー・画面を量を制限して記録</text><path d="M600 543v42m-10-10 10 10 10-10" stroke="#83b6cc" stroke-width="3" fill="none"/><rect x="65" y="600" width="1070" height="145" rx="12" fill="#153249" stroke="#647d91"/><text x="95" y="649" font-size="31" font-weight="bold">3. 保存に失敗しても</text><text x="95" y="701" font-size="26">最初の確認エラーを保持。診断失敗で上書きしない</text><path d="M600 753v42m-10-10 10 10 10-10" stroke="#83b6cc" stroke-width="3" fill="none"/><rect x="65" y="810" width="1070" height="145" rx="12" fill="#153249" stroke="#647d91"/><text x="95" y="859" font-size="31" font-weight="bold">4. 次の調査へ渡す</text><text x="95" y="911" font-size="26">再実行の成功と、原因確定・復旧保証を分ける</text><text x="65" y="1090" font-size="24">通常成功／制御した失敗／保存不能：結果は確定資料到着後に追記</text><text x="65" y="1135" font-size="23">実障害の原因確定・ロールバックを達成した図ではありません</text></svg>