gb(32, 39, 49)!important;}#my-svg .grow polygon{fill:rgb(255, 245, 214)!important;stroke:rgb(173, 116, 25)!important;color:rgb(32, 39, 49)!important;}#my-svg .grow ellipse{fill:rgb(255, 245, 214)!important;stroke:rgb(173, 116, 25)!important;color:rgb(32, 39, 49)!important;}#my-svg .grow circle{fill:rgb(255, 245, 214)!important;stroke:rgb(173, 116, 25)!important;color:rgb(32, 39, 49)!important;}#my-svg .grow path{fill:rgb(255, 245, 214)!important;stroke:rgb(173, 116, 25)!important;color:rgb(32, 39, 49)!important;}#my-svg .grow tspan{fill:rgb(32, 39, 49)!important;}</style><defs><marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2455b8"/></marker></defs><g><path d="M276 155 L356 155" fill="none" stroke="#2455b8" stroke-width="2.5" marker-end="url(#flow-arrow)"/><path d="M644 155 L712.8359375 155" fill="none" stroke="#2455b8" stroke-width="2.5" marker-end="url(#flow-arrow)"/><path d="M927.1640625 155 L1032 155" fill="none" stroke="#2455b8" stroke-width="2.5" marker-end="url(#flow-arrow)"/><path d="M1140 119 L1140 45 L180 45 L180 101" fill="none" stroke="#2455b8" stroke-width="2.5" marker-end="url(#flow-arrow)"/><path d="M180 209 L180 290 L1140 290 L1140 389" fill="none" stroke="#2455b8" stroke-width="2.5" marker-end="url(#flow-arrow)"/><path d="M1044 425 L940 425" fill="none" stroke="#2455b8" stroke-width="2.5" marker-end="url(#flow-arrow)"/><path d="M700 425 L596 425" fill="none" stroke="#2455b8" stroke-width="2.5" marker-end="url(#flow-arrow)"/><path d="M404 425 L276 425" fill="none" stroke="#2455b8" stroke-width="2.5" marker-end="url(#flow-arrow)"/><path d="M84 425 L25 425 L25 155 L84 155" fill="none" stroke="#2455b8" stroke-width="2.5" marker-end="url(#flow-arrow)"/></g><g class="node default play" id="my-svg-flowchart-A-0" data-look="classic" transform="translate(180,155)"><rect class="basic label-container" style="fill:#e8f1ff !important;stroke:#2455b8 !important" x="-96" y