<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>月影機関・新規ルート確認</title><style>body{margin:0;background:#080e1b;color:#dceafa;font:16px sans-serif}main{max-width:700px;margin:24px auto;padding:16px}canvas{display:block;width:100%;height:auto;image-rendering:pixelated}fieldset{border:1px solid #3a536a;margin:18px 0;display:flex;flex-wrap:wrap;gap:12px}button,select{font:inherit;padding:8px;background:#172940;color:#e4eefb;border:1px solid #617c94}label{display:flex;align-items:center;gap:6px}input[type=range]{width:100%}p{line-height:1.6}</style><main><h1>新規ルート確認</h1><p>開発用・表示だけの確認画面。抽選や獲得処理は動かしません。</p><div id="screen"></div><fieldset><label>演出<select id="route"><option value="basic">短いリーチ</option><option value="direct">直当たり</option><option value="moon">二重月輪</option><option value="sword">紋章完成</option></select></label><label>状態<select id="mode"><option value="normal">通常</option><option value="rush">RUSH</option></select></label><label><input id="win" type="checkbox">当たり</label><label><input id="reduced" type="checkbox">効果控えめ</label><button id="play">再生</button><button id="restart">最初から</button></fieldset><input id="time" type="range" min="0" max="7" step=".01" value="0"><p id="status"></p></main><script type="module" src="/src/special-routes.js"></script></html>
