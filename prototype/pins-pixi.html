<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>釘と銀玉・実働確認</title></head><body><main><header><p>月影機関 / PIXIJS 部品試作</p><h1>釘：玉を弾いて、次の列へ。</h1><p>共通の銀玉と、3段階の陰影で描く金色の釘</p></header><section class="workspace"><div class="visual"><div id="canvas"></div><div class="state" id="state">振り分け釘</div></div><aside><h2 id="step">待機</h2><p>振り分け釘 → 寄り釘 → 道釘を順番に拡大。既存の釘列で実際に玉を流します。</p><dl><div><dt>発射</dt><dd id="shots">0</dd></div><div><dt>この種類の釘に触れた玉</dt><dd id="hits">0</dd></div><div><dt>表示中の釘</dt><dd id="pinCount">0</dd></div></dl><button id="demo">36秒の実演を開始</button><div class="buttons"><button id="zone0">振り分け釘</button><button id="zone1">寄り釘</button><button id="zone2">道釘</button></div><div class="buttons"><button id="feed">発射 ON/OFF</button><button id="pause">一時停止</button></div><label><input id="guides" type="checkbox">釘の当たり判定を表示</label><p class="note">中央始動口などと同じ釘素材を共通化。配置・半径・反発・発射条件は維持しています。接触した玉数は種類ごとの盤面全体の累計です。</p></aside></section></main><script type="module" src="/src/pixi/pins-preview.js"></script></body></html>
