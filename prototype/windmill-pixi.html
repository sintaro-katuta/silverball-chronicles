<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>風車・実働確認</title></head><body><main><header><p>月影機関 / PIXIJS 部品試作</p><h1>風車：玉に押されて回る。</h1><p>共通の銀玉・金の軸・青い羽根</p></header><section class="workspace"><div class="visual"><div id="canvas"></div><div class="state">左側の風車 · 接触で回転</div></div><aside><h2 id="step">待機</h2><p>釘を通った玉が羽根に当たり、風車を回しながら下へ流れます。</p><dl><div><dt>発射</dt><dd id="shots">0</dd></div><div><dt>風車への接触</dt><dd id="hits">0</dd></div><div><dt>回転速度（rad/s）</dt><dd id="speed">0</dd></div></dl><button id="demo">30秒の実演を開始</button><div class="buttons"><button id="feed">発射 ON/OFF</button><button id="pause">一時停止</button></div><label><input id="guides" type="checkbox">羽根の接触線を表示</label><p class="note">既存の左側風車・4本の接触軸と回転角をそのまま描画。釘配置・玉の物理は既存のものを使用しています。</p><p class="note">独立した部品試作。抽選・賞球・保存は行いません。</p></aside></section></main><script type="module" src="/src/pixi/windmill-preview.js"></script></body></html>
