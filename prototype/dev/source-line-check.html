<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>元図の線をクリックして共有</title>
<style>body{margin:0;background:#edf0f2;color:#172330;font:16px system-ui}main{max-width:1320px;margin:auto;padding:18px}h1{font-size:21px;margin:0 0 8px}p{line-height:1.6;margin:8px 0}svg{display:block;width:100%;height:min(69vh,740px);background:#fff;border:1px solid #a9b4bc;cursor:crosshair;touch-action:manipulation}button{font:inherit;padding:7px 12px;margin:8px 8px 8px 0;background:#fff;border:1px solid #73828c;border-radius:4px;cursor:pointer}#selection{font:14px/1.6 ui-monospace,monospace;white-space:pre-line}small{color:#526271}</style>
<main><h1>元図の線をクリックして共有</h1><p>該当する線をクリックしてください。複数箇所に印を付けられます。①②の候補は取り下げました。</p><svg id="source" viewBox="100 560 660 360" aria-label="左入口からヘソまでの元図。クリックした位置に印を保存"><image width="904" height="1280"/><g id="marks"></g></svg><div><button id="undo">最後の印を戻す</button><button id="clear">印をすべて消す</button><button id="whole" aria-pressed="false">盤面全体を見る</button></div><p id="selection" role="status">印はまだありません。</p><small>元図と盤面の実装は変更しません。クリックした印はこのブラウザーに保存されます。「印を付けた」とチャットで伝えてもらえれば、こちらで位置を確認します。カーソルの常時共有ではありません。</small></main><script type="module">
const $=s=>document.querySelector(s),ns='http://www.w3.org/2000/svg',key='source-line-check-marks-v1',svg=$('#source');let points=[];try{const saved=JSON.parse(localStorage.getItem(key));if(Array.isArray(saved))points=saved.filter(p=>Number.isFinite(p.x)&&Number.isFinite(p.y));}catch{}
svg.querySelector('image').setAttribute('href',new URL('../reference-review/pixi-source-layout/reference.jpg',import.meta.url).href);
function render(){const marks=$('#marks');marks.replaceChildren();for(const[p,index]of points.map((p,i)=>[p,i])){const g=document.createElementNS(ns,'g');const r=document.createElementNS(ns,'circle');for(const[k,v]of Object.entries({cx:p.x,cy:p.y,r:4,fill:'none',stroke:'#cc2459','stroke-width':1}))r.setAttribute(k,v);const text=document.createElementNS(ns,'text');for(const[k,v]of Object.entries({x:p.x+6,y:p.y-6,fill:'#a41447','font-size':12,'font-family':'system-ui','paint-order':'stroke',stroke:'white','stroke-width':3}))text.setAttribute(k,v);text.textContent=index+1;g.append(r,text);marks.append(g);}$('#selection').textContent=points.length?points.map((p,i)=>`印${i+1} · 元画像 (${p.x.toFixed(1)}, ${p.y.toFixed(1)})`).join('\n'):'印はまだありません。';$('#undo').disabled=$('#clear').disabled=!points.length;try{localStorage.setItem(key,JSON.stringify(points));}catch{$('#selection').textContent+='\nこのブラウザーには保存できません。';}}
svg.addEventListener('click',e=>{const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse());if(p.x<0||p.x>904||p.y<0||p.y>1280)return;points.push({x:Math.round(p.x*10)/10,y:Math.round(p.y*10)/10});render();});$('#undo').onclick=()=>{points.pop();render();};$('#clear').onclick=()=>{points=[];render();};$('#whole').onclick=()=>{const whole=$('#whole').getAttribute('aria-pressed')!=='true';svg.setAttribute('viewBox',whole?'40 100 830 850':'100 560 660 360');$('#whole').setAttribute('aria-pressed',String(whole));$('#whole').textContent=whole?'左入口とヘソへ戻る':'盤面全体を見る';};render();
</script></html>
