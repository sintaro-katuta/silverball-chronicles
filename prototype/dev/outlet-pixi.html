<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>樹脂ガイドとOUT口・実働確認</title></head><body><main><header><p>月影機関 / PIXIJS 部品試作</p><h1>球路：坂を流れて、回収口へ。</h1><p>透明な樹脂の縁・厚みと、暗いOUT口</p></header><section class="workspace"><div class="visual"><div id="canvas"></div><div class="state">下部の樹脂ガイド · OUT口</div></div><aside><h2 id="step">待機</h2><p>入賞しなかった玉が左右の坂を流れ、中央の回収口へ落ちます。玉は手前の縁の奥へ消えます。</p><dl><div><dt>発射</dt><dd id="shots">0</dd></div><div><dt>OUT</dt><dd id="outs">0</dd></div><div><dt>入賞済み</dt><dd id="prizes">0</dd></div></dl><button id="demo">30秒の実演を開始</button><div class="buttons"><button id="feed">発射 ON/OFF</button><button id="pause">一時停止</button></div><label><input id="guides" type="checkbox">ガイド中心線・回収高さを表示</label><p class="note">既存の左右の坂と回収処理を使用。共通銀玉の大きさ・傾斜・反発・入賞判定を維持した独立試作です。</p><p class="note">カウントは盤面全体の累計。抽選・賞球・保存は接続していません。</p></aside></section></main><script type="module" src="/src/dev/outlet-preview.js"></script></body></html>
