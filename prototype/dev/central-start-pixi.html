<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中央始動口・実働確認</title></head><body><main><header><p>月影機関 / PIXIJS 部品試作</p><h1>中央始動口：玉を受けて奥へ。</h1><p>素材08の青い器・金の装飾をドット絵で配置</p></header><section class="workspace"><div class="visual"><div id="canvas"></div><div class="state">中央始動口 · 常時開放</div></div><aside><h2 id="step">待機</h2><p>左打ちで発射した玉が釘を通り、中央の穴へ入ります。外れた玉は下へ流れます。</p><dl><div><dt>発射</dt><dd id="shots">0</dd></div><div><dt>中央始動口入賞</dt><dd id="hits">0</dd></div><div><dt>OUT</dt><dd id="outs">0</dd></div></dl><button id="demo">30秒の実演を開始</button><div class="buttons"><button id="feed">発射 ON/OFF</button><button id="pause">一時停止</button></div><label><input id="guides" type="checkbox">入賞判定線を表示</label><p class="note">既存の発射・釘・衝突・入口判定を使用。玉の通り道や入賞幅を変更しない独立試作です。</p><p class="note">入賞はカウントのみ。抽選・賞球・保存は行いません。</p></aside></section></main><script type="module" src="/src/dev/central-start-preview.js"></script></body></html>
