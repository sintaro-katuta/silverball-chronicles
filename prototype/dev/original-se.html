<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>月影機関 · オリジナル効果音</title><style>body{background:#101a2b;color:#eee;font:16px sans-serif;margin:24px;max-width:900px}button,select{font:inherit;padding:10px;margin:4px}section{border-bottom:1px solid #667;padding:10px}small{color:#bcd}button:focus-visible{outline:3px solid #fff}</style><h1>月影機関 · 効果音試聴</h1><p>金属・月光・粒状ノイズの音型。各イベントに4種類を順番に割り当てます。</p><button id="stop">停止</button><label>音量 <input id="volume" type="range" min="0" max="1" value="0.65" step="0.05"></label><p id="status" role="status">音名のボタンで試聴できます。</p><main id="list"></main><script type="module">
import {SE_CATALOG,synthesizeSe} from '../src/pixi/se/original-se.js';
let ctx,bus,source;const stop=()=>{if(source){source.stop();source=null;}};
const list=document.querySelector('#list'),status=document.querySelector('#status');
for(const [name,spec] of Object.entries(SE_CATALOG)){const row=document.createElement('section');row.append(Object.assign(document.createElement('strong'),{textContent:name+' '}));row.append(Object.assign(document.createElement('small'),{textContent:spec.style+' · '+spec.duration.toFixed(2)+'秒 '}));for(let v=0;v<4;v++){const button=document.createElement('button');button.textContent='音型 '+(v+1);button.setAttribute('aria-label',name+' 音型 '+(v+1));button.onclick=async()=>{if(!ctx){ctx=new AudioContext();bus=ctx.createGain();bus.connect(ctx.destination);}await ctx.resume();stop();bus.gain.value=Number(document.querySelector('#volume').value);const pcm=synthesizeSe(name,v,ctx.sampleRate),b=ctx.createBuffer(2,pcm.left.length,ctx.sampleRate);b.copyToChannel(pcm.left,0);b.copyToChannel(pcm.right,1);source=ctx.createBufferSource();source.buffer=b;source.connect(bus);source.start();status.textContent=name+' · 音型 '+(v+1);};row.append(button);}list.append(row);}
document.querySelector('#stop').onclick=stop;document.querySelector('#volume').oninput=e=>{if(bus)bus.gain.value=Number(e.target.value);};document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});
</script></html>
