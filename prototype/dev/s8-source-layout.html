<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>元図と本編の配置照合</title><style>body{margin:20px;background:#101923;color:#eef3f7;font:15px system-ui}h1{font-size:22px}p{max-width:1000px;line-height:1.7}main{display:grid;grid-template-columns:1fr 1fr;gap:18px}figure{margin:0}figcaption{margin:10px 0;font-weight:bold}svg{display:block;width:100%;background:white}label{display:inline-block;margin:8px 0}output{display:block;padding:12px;background:#203447}a{color:#a2d8ff}@media(max-width:700px){main{grid-template-columns:1fr}}</style><h1>元の東京喰種の盤面図と本編の配置照合</h1><p>元図の101釘の採寸点と、本編の釘中心を同じ画像座標で照合します。参照画像はローカルの確認用です。玉径・奥行き・実機寸法の完全再現を示すものではありません。</p><output id="result">照合中</output><p><a href="/dev/s8-guide-audit.html">ガイドは部位別の拡大画面で確認</a>（釘の差分0はガイドの一致判定を含みません）</p><label><input type="checkbox" id="rails" checked> ガイドを重ねる（青＝接触・橙＝成形縁）</label><main><figure><figcaption>元図（変更なし）</figcaption><svg id="original" viewBox="75 245 745 690"><image href="/reference-review/pixi-source-layout/reference.jpg" width="904" height="1280"/></svg></figure><figure><figcaption>元図に本編の釘中心を重ねる（緑＝一致、赤＝差分）</figcaption><svg id="overlay" viewBox="75 245 745 690"><image href="/reference-review/pixi-source-layout/reference.jpg" width="904" height="1280" opacity=".45"/><g id="geometry" fill="none" stroke="#0088be" stroke-width="1.5"></g><g id="pins"></g></svg></figure></main><p><a href="/?review=session&scenario=reach-loss" target="_blank">本編の確認用画面を開く</a> · 緑の円は釘の中心を示し、釘頭の大きさを変更するものではありません。</p><script type="module">
import {guideColliderSvg} from '/src/dev/guide-overlay.js';
import {createBoardFlow} from '/src/pixi/board-flow.js';import {productionBoardFlowOptions} from '/src/app/production-board-profile.js';
const raw=await fetch('/reference-review/tokyoghoul-w-handoff/designer-pin-comparison.html').then(r=>r.text()),expected=[...raw.matchAll(/<circle cx="([\d.]+)" cy="([\d.]+)"/g)].map(m=>[Number(m[1]),Number(m[2])]);
const p=createBoardFlow({lcd:true,...productionBoardFlowOptions()}).flow.physics,src=q=>[q.x*2+28,(q.y-120)*2];let changed=0,max=0;
const pins=p.pins.map((pin,i)=>{const [x,y]=src(pin),d=Math.hypot(x-expected[i][0],y-expected[i][1]);if(d>1e-8)changed++;max=Math.max(max,d);return `<circle cx="${x}" cy="${y}" r="4" fill="none" stroke="${d>1e-8?'#e32a32':'#079658'}" stroke-width="1.6"><title>${pin.id}: ${x}, ${y}</title></circle>`;}).join('');document.querySelector('#pins').innerHTML=pins;
const geometry=p.colliders.filter(c=>c.role==='left-inlet-guide'||c.role.startsWith('right-channel-')||c.role.startsWith('lcd-boundary-')||c.sourceComponentId||c.sourceGuideId).map(guideColliderSvg).join('');document.querySelector('#geometry').innerHTML=geometry+(p.sourceGuidePaths??[]).filter(q=>!q.contact).map(q=>`<polyline stroke="#cc6200" points="${q.worldPoints.map(src).map(a=>a.join(',')).join(' ')}"/>`).join('');
document.querySelector('#result').textContent=`釘中心の差分 ${changed} / ${p.pins.length} 本 · 最大差 ${max.toFixed(3)} source px · ヘソ口幅 ${p.pockets.find(q=>q.kind==='start').w} world · 球半径 ${p.ballRadius} world`;
document.querySelector('#rails').onchange=e=>document.querySelector('#geometry').style.display=e.target.checked?'':'none';
</script></html>
