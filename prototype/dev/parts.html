<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>月影機関 — 部品プレビュー</title><style>body{margin:0;background:#07101a;color:#dceaf0;font:14px system-ui}main{max-width:720px;margin:auto;padding:20px}h1{font-size:20px}label{display:inline-flex;gap:8px;margin:8px}button,select{padding:10px;background:#162735;color:inherit;border:1px solid #52697c}#partCanvas{height:62dvh;max-height:750px;background:#0b1721;border:1px solid #334959}#partCanvas canvas{display:block;width:100%;height:100%}p{line-height:1.7;color:#a9bac8}</style></head><body><main><h1>部品プレビュー</h1><label>部品<select id="part"><option value="right">右打ちユニット・球路全体</option><option value="right-inlet">右始動口・拡大</option><option value="right-attacker">アタッカー・拡大</option><option value="receivers">一般・始動入賞口</option><option value="all">台全体</option><option value="cabinet">新筐体・外装</option></select></label><label>状態<select id="state"><option value="normal">通常・閉鎖</option><option value="rush">RUSH・始動口開放</option><option value="bonus">大当り・アタッカー開放</option></select></label><label>視点<select id="angle"><option value="front">正面</option><option value="oblique">斜め・厚みの確認</option></select></label><div class="flow-controls"><button id="singleFlow">単発</button> <button id="continuousFlow">連続</button> <button id="stopFlow">発射停止</button> <button id="pauseFlow">一時停止</button> <button id="resetFlow">玉・計数リセット</button></div><p id="flowStatus" role="status">待機中</p><div id="partCanvas"></div><p id="flowCounts" aria-label="実入賞の計数"></p><p>実際の発射口から強さ100%で玉を発射します。右部品表示では発射通路は画面外です。「台全体」で発射から確認できます。通常／RUSH／大当りの開閉を固定した検証用で、大当りは10カウント後も開放を維持します。実遊技のラウンド進行・抽選・賞球・保存は行いません。状態変更は玉と計数をリセットします。別タブへ移ると一時停止します。</p></main><script type="module" src="/src/dev/part-preview.js"></script></body></html>
