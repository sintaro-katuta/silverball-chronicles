<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ガイドの部位別照合</title><style>body{background:#15202a;color:#eee;margin:20px;font:15px system-ui}h1{font-size:22px}section{margin:28px 0}main{display:grid;grid-template-columns:1fr 1fr;gap:16px}figure{margin:0}svg{background:#fff;width:100%;height:640px;display:block}figcaption{padding:8px}label{margin-right:15px}a{color:#addef9}nav{position:sticky;top:0;background:#15202a;padding:10px;z-index:2}nav a{margin:0 10px}section{scroll-margin-top:45px}p{line-height:1.7;max-width:1000px}</style><h1>元画像と本編ガイドの部位別照合</h1><p id="current-guide-version"></p><p><a href="/dev/guide-editor.html">マウスで線を編集する</a></p><p>元画像は通常濃度のまま表示。左が元画像、右が本編の接触線。線を消して灰色の輪郭と比較できます。釘の一致とガイドの一致は別の確認です。紫破線は元画像に未校正の可動部モデルです。線から実機の奥行きや機能は確定しません。</p><label><input id="guides" type="checkbox" checked> 接触線</label><label><input id="details" type="checkbox" checked> 成形縁（接触なし）</label><label><input id="pins" type="checkbox" checked> 釘中心</label><nav><a href="#region-1">部位1</a><a href="#region-2">部位2</a><a href="#region-3">部位3</a><a href="#region-4">部位4</a><a href="#region-5">部位5</a><a href="#region-6">部位6</a><a href="#region-7">部位7</a><a href="#region-8">部位8</a></nav><div id="regions"></div><script type="module">
import{guideColliderSvg}from'/src/dev/guide-overlay.js';
import{createBoardFlow}from'/src/pixi/board-flow.js';import{productionBoardFlowOptions}from'/src/app/production-board-profile.js';
const p=createBoardFlow({lcd:true,...productionBoardFlowOptions()}).flow.physics,source=q=>[q.x*2+28,(q.y-120)*2],img='<image href="/reference-review/pixi-source-layout/reference.jpg" width="904" height="1280"/>',points=ps=>ps.map(q=>source(q).join(',')).join(' ');
document.querySelector('#current-guide-version').textContent=`本編ガイド：${p.sourceGuideTraceVersion} · ユーザー保存ファイル 2026-10-24 08:15:52 UTC の座標を使用`;
const guides=p.colliders.filter(c=>c.role==='left-inlet-guide'||c.role.startsWith('lcd-boundary-')||c.role.startsWith('right-channel-')||c.role==='right-inner-lower'||c.sourceComponentId||c.sourceGuideId).map(guideColliderSvg).join('');
const details=(p.sourceGuidePaths??[]).filter(q=>!q.contact||q.contactRole==='decoration').map(q=>`<polyline points="${points(q.worldPoints)}"/>`).join('');
const pins=p.pins.map(q=>{const[x,y]=source(q);return`<circle cx="${x}" cy="${y}" r="3.4"/>`;}).join('');
const grid=(x,y,w,h)=>`<g fill="#a04" stroke="#a04" stroke-width=".15" font-size="4">${Array.from({length:Math.ceil(w/20)},(_,i)=>{const a=Math.ceil(x/20)*20+i*20;return `<path d="M${a} ${y}v${h}"/><text x="${a+1}" y="${y+6}">${a}</text>`;}).join('')}${Array.from({length:Math.ceil(h/20)},(_,i)=>{const a=Math.ceil(y/20)*20+i*20;return `<path d="M${x} ${a}h${w}"/><text x="${x+1}" y="${a-1}">${a}</text>`;}).join('')}</g>`;
const notes={1:'自由に立つガイドを元画像の中心線へ再採寸。タイトル左側の縁は別の線として扱う。',2:'旧位置はタイトルの右側を通っていた。左側の輪郭へ移し、下の斜面を釘の右側へ戻した。',3:'丸い部分と開いた上端を別々に採寸。横の黒い帯は表示だけとし、画像から機能を断定して通路を塞がない。',4:'道釘側の外縁、厚い成形縁、液晶側の内縁、途中の段差をそれぞれ転記。橙の線には接触を追加していない。',5:'緑の印刷面を横切る旧斜線を撤去。実際に見える外側・内側の壁、枝分かれ、下の曲がりを転記。紫破線の可動部モデルは今回変更していない。',6:'上側は数点の直線近似から曲線の途中の採寸点へ変更。折れ曲がりの高さと下側への接続を合わせる。'};
const regions=[['1 左入口',95,340,90,245],['2 タイトル脇の左側の縁',125,350,95,290],['3 左下の曲面と接続',125,590,110,160],['4 液晶下の複数の縁',165,700,515,145],['5 右下の通路',520,600,295,340],['6 右上の通路',680,245,145,430],['7 下縁拡大',475,750,200,120],['8 右下拡大',625,790,120,150]];
document.querySelector('#regions').innerHTML=regions.map(([name,x,y,w,h])=>`<section id="region-${name[0]}"><h2>${name}</h2><p>${notes[Number(name[0])]??'接続部を座標目盛で拡大確認。'}</p><main><figure><figcaption>元画像</figcaption><svg viewBox="${x} ${y} ${w} ${h}">${img}${grid(x,y,w,h)}</svg></figure><figure><figcaption>青＝ガイド・橙＝成形縁・紫破線＝可動部モデル</figcaption><svg viewBox="${x} ${y} ${w} ${h}">${img}<g class="guides" fill="none" stroke="#008ec4" stroke-width=".8">${guides}</g><g class="details" fill="none" stroke="#cc6200" stroke-width=".8">${details}</g><g class="pins" fill="none" stroke="#05a065" stroke-width="1">${pins}</g></svg></figure></main></section>`).join('');
if(location.hash)document.getElementById(location.hash.slice(1))?.scrollIntoView();
for(const k of ['guides','details','pins'])document.querySelector('#'+k).onchange=e=>document.querySelectorAll('.'+k).forEach(g=>g.style.display=e.target.checked?'':'none');
</script></html>
