<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W 制御接続レビュー</title><style>body{margin:0;background:#081322;color:#e6edf5;font:16px system-ui}main{max-width:1060px;margin:auto;padding:24px}h1{font-size:24px}p{line-height:1.7;color:#b4c7dd}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}section{border:1px solid #38506a;border-radius:8px;padding:16px;background:#0e2033}button,select{font:inherit;padding:10px;margin:4px;border-radius:5px;border:1px solid #7691ab;background:#172f47;color:white}button:hover{background:#2a526d}.value{font-size:32px;color:#83dfdb}pre{white-space:pre-wrap;max-height:340px;overflow:auto;font:13px ui-monospace;color:#b7d2e7}#status{min-height:28px;color:#ffd185}a{color:#87d8ff}</style></head><body><main><h1>月影機関 · W 制御接続レビュー</h1><p>実機Wへの移行用。物理盤面と演出は未接続です。入賞・開閉・V検出を手動で送り、抽選と払出の境界を確認します。開放時間と通常時の突入振分けは未確認のため自動化していません。</p><button data-action="reset">リセット</button><label>次の検証用乱数 <select id="roll"><option value="0.9">ハズレ</option><option value="0">図柄揃い／普図当選</option><option value="0.004">チャージ</option></select></label><p id="status" role="status"></p><div class="grid"><section><h2>通常・普図</h2><button data-action="start">ヘソに1玉</button><button data-action="normal">特図1を消化</button><button data-action="enter">RUSH突入指令</button><button data-action="leave">通常復帰指令</button><button data-action="fixture">RUSH開始（検証用）</button><button data-action="fuzu">普図作動口に1玉</button><button data-action="resolveFuzu">普図を消化</button><button data-action="ordinary">一般口に1玉</button></section><section><h2>電チュー・V</h2><button data-action="openElectric">電チュー開放</button><button data-action="electric">電チューに1玉</button><button data-action="closeElectric">電チュー閉鎖</button><button data-action="tokuzu2">特図2を消化</button><button data-action="v">V検出</button><button data-action="noV">V未検出で終了</button></section><section><h2>アタッカー</h2><button data-action="openRound">ラウンド開放</button><button data-action="ball">実入賞1玉</button><button data-action="ten">実入賞10玉を送信</button><button data-action="timeout">時間切れ閉鎖</button><p>10玉到達で閉鎖。入賞不足は補填しません。3000個分でも10Rを2回に分けます。</p></section></div><p>実入賞からの累計払出 <strong class="value" id="payout">0</strong></p><div class="grid"><section><h2>現在の制御状態</h2><pre id="state"></pre></section><section><h2>直近のイベント</h2><pre id="events"></pre></section></div><p><a href="/">遊技画面へ戻る（旧抽選制御）</a></p></main><script type="module" src="/src/dev/w-control-review.js"></script></body></html>
