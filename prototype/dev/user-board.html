<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>保存した線で組んだ盤面</title><style>body{margin:0;background:#08111e;color:#e4ecf3;font:14px system-ui}header{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid #30475b;flex-wrap:wrap}h1{font-size:16px;margin:0;font-weight:600}a{color:#b6d9ed}nav{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;padding:10px}button{font:inherit;color:#e4ecf3;background:#152a3d;border:1px solid #5e788c;padding:7px 12px;border-radius:4px;cursor:pointer}button[aria-pressed=true]{border-color:#d4bd7e;color:#ffe2a0}#canvas{height:calc(100dvh - 140px);width:auto;max-width:100%;aspect-ratio:396/436;margin:auto}footer{height:28px;text-align:center;font-size:12px;color:#a0b6c8}#loading{position:fixed;inset:130px 0 auto;text-align:center;background:#08111e;padding:20px}#loading[hidden]{display:none}@media(max-width:600px){header{padding:8px 12px;gap:7px}h1{font-size:14px}header a{font-size:12px}nav{padding:8px 0}button{padding:6px 10px;font-size:12px}#canvas{height:auto;width:100%;max-height:calc(100dvh - 155px)}footer{font-size:11px}}</style></head><body><header><h1>保存した線で組んだ盤面</h1><a href="/">本編へ</a><a href="/dev/guide-editor.html">線を編集</a><a href="/dev/s8-guide-audit.html">元図との照合</a></header><nav aria-label="盤面表示"><button data-view="board" aria-pressed="true">盤面</button><button data-view="whole" aria-pressed="false">全体</button><button data-view="lcd" aria-pressed="false">液晶</button><button id="feed-toggle">玉を流す</button><button id="pause-toggle">表示を動かす</button></nav><main id="host"><div id="canvas"></div></main><div id="loading" role="status">盤面を読み込み中…</div><footer id="board-status">ユーザー保存線 · 発射停止中</footer><script type="module">
import{mountBoard}from'/src/pixi/board-runtime.js';import{productionBoardFlowOptions}from'/src/app/production-board-profile.js';
let paused=true,feeding=false;const board=await mountBoard(document.querySelector('#host'),{production:true,flowOptions:productionBoardFlowOptions(),onLoadProgress:value=>document.querySelector('#loading').textContent=`盤面を読み込み中… ${Math.round(value*100)}%`});board.feed(false);board.pause(true);document.querySelector('#loading').hidden=true;
function status(){document.querySelector('#feed-toggle').textContent=feeding?'発射を止める':'玉を流す';document.querySelector('#pause-toggle').textContent=paused?'表示を動かす':'一時停止';document.querySelector('#board-status').textContent=`ユーザー保存線 · ${feeding?'発射中':paused?'発射停止・静止表示':'発射停止中'}`;}
for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>{board.setView(b.dataset.view);for(const q of document.querySelectorAll('[data-view]'))q.setAttribute('aria-pressed',String(q===b));};
document.querySelector('#feed-toggle').onclick=()=>{feeding=!feeding;if(feeding){paused=false;board.pause(false);}board.feed(feeding);status();};document.querySelector('#pause-toggle').onclick=()=>{paused=!paused;board.pause(paused);status();};window.addEventListener('pagehide',()=>board.dispose(),{once:true});status();
</script></body></html>
