<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>元の盤面図・位置の共有</title>
<style>body{margin:0;background:#e9ecee;color:#172330;font:15px system-ui}header{padding:14px 24px;background:#fff;border-bottom:1px solid #aab5bf}h1{font-size:20px;margin:0 0 6px}p{margin:6px 0;line-height:1.6}main{display:grid;grid-template-columns:minmax(280px,390px) minmax(400px,1fr);gap:20px;padding:20px;max-width:1450px;margin:auto}section{min-width:0}h2{font-size:16px;margin:0 0 10px}svg{display:block;width:100%;background:white;cursor:crosshair;touch-action:manipulation}#overview{max-height:76vh}#detail{height:min(66vh,680px);border:1px solid #84929e}label,button,input,select{font:inherit}button,input,select{padding:6px;margin:3px}#selection{font:600 18px ui-monospace,monospace;margin:12px 0}small{display:block;color:#455562;margin-top:8px}input{width:70px}#grid.hidden{display:none}@media(max-width:800px){main{grid-template-columns:1fr}#overview{height:45vh}#detail{height:65vh}}</style>
<header><h1>元の盤面図・位置の共有</h1><p>全体図で場所を選び、右の拡大図で細部をクリックしてください。印と元画像の座標が残ります。</p><small>図の線は変更しません。カーソルの動きの常時共有はありません。クリックして残した印を、次の発言を受けて確認します。</small></header>
<main><section><h2>全体図 · 100pxごとの位置番号</h2><svg id="overview" viewBox="0 0 904 1280" aria-label="元の盤面図の全体"><image href="/reference-review/pixi-source-layout/reference.jpg" width="904" height="1280"/><g id="grid"></g><rect id="region" fill="#1888bb12" stroke="#087fb1" stroke-width="3"/><g id="overviewMark" fill="none" stroke="#d12a52" stroke-width="3"></g></svg></section>
<section><h2>細部 · 元画像を拡大（線の補間・描き直しなし）</h2><div><label>表示範囲 <select id="span"><option value="240">広め · 240px</option><option value="120" selected>細部 · 120px</option><option value="60">さらに拡大 · 60px</option></select></label><label><input type="checkbox" id="showGrid" checked style="width:auto">全体のマス目</label></div><div id="selection" role="status"></div><svg id="detail" aria-label="選択位置の拡大図"><image href="/reference-review/pixi-source-layout/reference.jpg" width="904" height="1280"/><g id="detailMark" fill="none" stroke="#d12a52"></g></svg><div><label>元画像 X <input id="x" type="number" min="0" max="904" step="0.1"></label><label>Y <input id="y" type="number" min="0" max="1280" step="0.1"></label><button id="move">この位置へ</button></div><small>番号は場所を指すためだけに使います。細い線の違いや接続は、拡大図と小数座標で確認します。拡大しても元画像にない細部は復元できません。</small><p id="saved"></p></section></main>
<script type="module">
const $=s=>document.querySelector(s),ns='http://www.w3.org/2000/svg',key='source-discussion-point-v1';let selected={x:180,y:650},center={...selected};try{const old=JSON.parse(localStorage.getItem(key));if(Number.isFinite(old?.x)&&Number.isFinite(old?.y)){selected=old;center={...old};}}catch{}
for(let y=0;y<1280;y+=100)for(let x=0;x<904;x+=100){const rect=document.createElementNS(ns,'rect');for(const[k,v]of Object.entries({x,y,width:100,height:100,fill:'none',stroke:'#147b9c', 'stroke-width':1,opacity:.5}))rect.setAttribute(k,v);$('#grid').append(rect);const text=document.createElementNS(ns,'text');for(const[k,v]of Object.entries({x:x+4,y:y+21,fill:'#064a67','font-size':20,'font-family':'monospace','paint-order':'stroke',stroke:'white','stroke-width':3}))text.setAttribute(k,v);text.textContent=String.fromCharCode(65+x/100)+(y/100+1);$('#grid').append(text);}
function render(){const span=Number($('#span').value),vx=Math.max(0,Math.min(904-span,center.x-span/2)),vy=Math.max(0,Math.min(1280-span,center.y-span/2));$('#detail').setAttribute('viewBox',`${vx} ${vy} ${span} ${span}`);for(const[k,v]of Object.entries({x:vx,y:vy,width:span,height:span}))$('#region').setAttribute(k,v);const{x,y}=selected;for(const[id,r,w]of[['overviewMark',7,3],['detailMark',span/70,span/500]]){$('#'+id).innerHTML=`<circle cx="${x}" cy="${y}" r="${r}" stroke-width="${w}"/><path d="M${x-r*3},${y}H${x-r*1.6}M${x+r*1.6},${y}H${x+r*3}M${x},${y-r*3}V${y-r*1.6}M${x},${y+r*1.6}V${y+r*3}" stroke-width="${w}"/>`;}
$('#selection').textContent=`選択 ${String.fromCharCode(65+Math.min(9,Math.floor(x/100)))}${Math.min(13,Math.floor(y/100)+1)} · 元画像 X=${x.toFixed(1)} / Y=${y.toFixed(1)}`;$('#x').value=x.toFixed(1);$('#y').value=y.toFixed(1);}
function choose(x,y,recenter){selected={x:Math.round(Math.max(0,Math.min(904,x))*10)/10,y:Math.round(Math.max(0,Math.min(1280,y))*10)/10};if(recenter)center={...selected};try{localStorage.setItem(key,JSON.stringify(selected));$('#saved').textContent='この印はこのブラウザーに保存されています。';}catch{$('#saved').textContent='保存できません。表示中の印と座標を使ってください。';}render();}
for(const id of ['overview','detail'])$('#'+id).addEventListener('click',e=>{const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(e.currentTarget.getScreenCTM().inverse());choose(p.x,p.y,id==='overview');});$('#span').onchange=()=>{center={...selected};render();};$('#showGrid').onchange=()=>$('#grid').classList.toggle('hidden',!$('#showGrid').checked);$('#move').onclick=()=>{const x=Number($('#x').value),y=Number($('#y').value);if(Number.isFinite(x)&&Number.isFinite(y))choose(x,y,true);};render();
</script></html>
