<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>月影 長尺リーチ比較</title><style>body{margin:0;background:#060d1a;color:#dce7f3;font-family:monospace}main{max-width:900px;margin:auto;padding:16px}h1{font-size:20px}button,select{font:inherit;color:#f0ddb1;background:#15243b;border:1px solid #8d7851;padding:10px;min-height:44px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}#stage{aspect-ratio:3/2;overflow:hidden;background:#061022}canvas{display:block;width:100%!important;height:100%!important;image-rendering:pixelated}#pixi{width:100%;height:100%}input{width:100%}#status{line-height:1.8;font-size:13px}p{font-size:13px;line-height:1.8}a{color:#a4cfee}[hidden]{display:none!important}</style></head><body><main><h1>月影：リーチの動き比較</h1><p>同じ素材・動作・画素数で一つずつ再生します。人物のポーズ差分＋連続移動＋布のメッシュ変形。比較用の試作です。</p><nav><select id="engine" aria-label="描画エンジン"><option value="pixi">PixiJS</option><option value="three">Three.js</option></select><select id="variant" aria-label="演出パターン"><option value="pressure">逆境からの反撃</option><option value="initiative">先手からの逆転劇</option><option value="exchange">互角の斬り合い</option></select><select id="ending" aria-label="決着パターン"><option value="standard">通常決着（54秒）</option><option value="revival">復活（58秒）</option><option value="flash">RUSH一閃（12秒）</option></select><button id="play">再生</button><button id="restart">最初から</button><button id="battle">攻防（5秒）</button><button id="upper">上部案内（17秒）</button><button id="final">決着前（45秒）</button></nav><div id="stage"><div id="pixi"></div><canvas id="three" hidden></canvas></div><input id="time" type="range" min="2" max="51.6" step=".01" value="2" aria-label="演出時刻"><div id="status" role="status">準備中…</div><p>上部案内中も液晶の攻防を続けます。本編では上部の剣と月へつながります。計測値はこのブラウザのフレーム間隔とCPU描画送信時間で、GPU完了時間ではありません。</p><a href="/">月影の本編へ</a></main><script type="module" src="/src/dev/reach-comparison.js"></script></body></html>
