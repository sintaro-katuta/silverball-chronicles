<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>月影・物語予告確認</title><style>body{margin:0;background:#080e1b;color:#dceafa;font:16px sans-serif}main{max-width:700px;margin:24px auto;padding:16px}canvas{display:block;width:100%;height:auto;image-rendering:pixelated}fieldset{border:1px solid #3a536a;margin:18px 0;display:flex;flex-wrap:wrap;gap:12px}button,select{font:inherit;padding:8px;background:#172940;color:#e4eefb;border:1px solid #617c94}label{display:flex;align-items:center;gap:6px}input[type=range]{width:100%}p{line-height:1.6}</style><main><h1>物語予告確認</h1><p>開発用の専用カット確認。抽選・獲得処理は動かしません。</p><div id="screen"></div><fieldset><label>映像<select id="family"><option value="rescue">救出</option><option value="step">決意</option><option value="memory">記憶</option><option value="episode">防衛</option><option value="pursuit">追跡</option></select></label><label>編集<select id="window"><option value="5">通常5秒</option><option value="2">RUSH2秒</option><option value="1.43">短い予告</option><option value="6">全カット</option></select></label><label><input id="reduced" type="checkbox">効果控えめ</label><label><input id="upper" type="checkbox">上矢印</label><button id="play">再生</button><button id="restart">最初から</button></fieldset><input id="time" type="range" min="0" max="5" step=".01" value="0"><p id="status"></p></main><script type="module" src="/src/dev/story-predictions.js"></script></html>
