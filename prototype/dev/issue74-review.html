<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>通常画面の重なり確認</title><style>body{margin:0;background:#091321;color:#edf3ff;font:16px system-ui}main{max-width:1400px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,350px),1fr));gap:1rem}canvas{width:100%;image-rendering:pixelated;background:#070d1b}button,input{font:inherit}#status{color:#c8d9ff}</style><main><h1>通常画面：重なりの確認</h1><p>元絵、旧方式、現行の分離合成を同じ時刻で比較します。図柄・保留は含みません。</p><label>時刻 <input id="time" type="range" min="0" max="30" step="0.25" value="0"><output id="value">0.00</output> 秒</label><button id="play">再生</button><span id="status">読込中</span><div class="grid"><section><h2>元絵</h2><canvas id="base" width="630" height="420"></canvas></section><section><h2>雲と水</h2><canvas id="cloud" width="630" height="420"></canvas></section><section><h2>雲・水・毛先</h2><canvas id="full" width="630" height="420"></canvas></section><section><h2>現行の分離合成</h2><canvas id="layered" width="630" height="420"></canvas></section></div><script type="module" src="/src/dev/issue74-review.js"></script></main></html>
