<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ヘソ入口幅の計測結果</title><style>body{background:#edf1f4;color:#1d3040;font:16px system-ui;margin:0}main{max-width:1080px;padding:24px;margin:auto}h1{font-size:24px}p{line-height:1.7}.status{background:white;padding:16px;border-left:4px solid #277b9b}table{width:100%;border-collapse:collapse;background:white;margin:16px 0}th,td{text-align:right;padding:12px;border-bottom:1px solid #d0dae0}th:first-child,td:first-child{text-align:left}thead{background:#dce7ed}a{color:#006793}small{color:#546b7c}.scroll{overflow:auto}</style><main><h1>ヘソ入口幅の計測結果</h1><p>幅20を基準に18・16を比較。入口の中心・釘・ガイド・玉径・発射条件を維持し、口の表示と接触だけを一緒に狭めます。</p><p id="status" class="status">読み込み中…</p><p id="decision"></p><div class="scroll"><table><thead><tr><th>入口幅</th><th>入賞／発射</th><th>入賞率</th><th>基準との差</th><th>ヘソ付近の残球</th><th>全域の残球</th></tr></thead><tbody id="summary"></tbody></table></div><h2>各条件の結果</h2><div class="scroll"><table><thead><tr><th>幅／開始位相</th><th>段階</th><th>ヘソ</th><th>奥経由／前面経由</th><th>ヘソ付近の1秒以上の停留</th><th>液晶侵入</th></tr></thead><tbody id="cases"></tbody></table></div><p id="links"><a href="./heso-width-review.html?width=20">幅20で試射</a> ／ <a href="./heso-width-review.html?width=18">幅18で試射</a> ／ <a href="./heso-width-review.html?width=16">幅16で試射</a></p><small>各幅250発×3開始条件、停止後45秒。候補の確認は別の開始位相250発。全域の既知の残球と、入口周囲の変化を分けて記録します。入賞率はこの試射条件の観測値です。</small></main><script type="module">
const $=s=>document.querySelector(s);async function update(){try{const d=await(await fetch('/heso-width-measurement/progress.json',{cache:'no-store'})).json(),running=d.running;$('#status').textContent=d.complete?'比較完了：'+d.results.length+'条件':`計測中：${d.results.length}条件完了${running?` · 入口幅${running.width} · 開始${running.phase}秒 · ${running.shots}/250発 · ヘソ${running.heso}`:''}`;const group=w=>d.results.filter(r=>r.stage==='selection'&&r.width===w),sum=(a,key)=>a.reduce((n,r)=>n+r[key],0),nbase=sum(group(20),'spawned'),hbase=group(20).reduce((n,r)=>n+r.counts.start,0),rate=nbase?hbase/nbase:0;$('#summary').innerHTML=[20,18,16].map(w=>{const rs=group(w),n=sum(rs,'spawned'),h=rs.reduce((n,r)=>n+r.counts.start,0);return `<tr><td>${w}</td><td>${h}／${n}</td><td>${n?(100*h/n).toFixed(2)+'%':'—'}</td><td>${n===750&&nbase===750?(100*(h/n-rate)).toFixed(2)+'ポイント':'計測中'}</td><td>${sum(rs,'localRemaining')}</td><td>${rs.reduce((n,r)=>n+r.remaining.length,0)}</td></tr>`;}).join('');$('#cases').innerHTML=d.results.map(r=>`<tr><td>${r.width}／${r.phase}秒</td><td>${r.stage==='selection'?'比較':'別条件の確認'}</td><td>${r.counts.start}／${r.spawned}</td><td>${r.stageHeso}／${r.frontHeso}</td><td>${r.localStalls.length}</td><td>${r.lcdViolations}</td></tr>`).join('');$('#decision').textContent=d.complete?(d.adopted?`選別結果：入口幅${d.adopted}をローカル本編へ反映済み。`:'選別条件を満たす候補なし。入口20を維持。'):'入賞の減少・8%以上の下限・ヘソ周囲の停留を比較して、効果がある最小の変更を選びます。';if(!d.complete)setTimeout(update,3000);}catch{$('#status').textContent='結果データを準備中…';setTimeout(update,3000);}}void update();
</script></html>
