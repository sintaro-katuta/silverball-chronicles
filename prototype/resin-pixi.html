<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>樹脂ガイド単体</title><style>#canvas{aspect-ratio:512/384!important}</style></head><body><main><header><p>月影機関 / PIXIJS 部品試作</p><h1>樹脂ガイドだけを確認。</h1><p>上段：左側の坂 ／ 下段：右側の坂</p></header><section class="workspace"><div class="visual"><div id="canvas"></div><div class="state">形・厚み・透明感を単体で比較</div></div><aside><h2>左右のガイドを同じ倍率で</h2><p>OUT口を非表示にし、ガイドの全長が見えるよう上下に並べています。</p><label><input id="balls" type="checkbox">玉を表示</label><dl><div><dt>発射</dt><dd id="shots">0</dd></div></dl><button id="demo">玉を流して確認</button><div class="buttons"><button id="pause">一時停止</button></div><p class="note">両端寄りの取付け部とネジを追加。ネジは玉の走る縁より下に配置しています。玉は既存盤面の実発射を各ガイドの範囲で表示します。</p></aside></section></main><script type="module" src="/src/pixi/resin-preview.js"></script></body></html>
