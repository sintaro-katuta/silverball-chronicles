<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>月影機関・アタッカー接続試作</title></head><body><main><header><p>月影機関 / PIXIJS 部品試作</p><h1>扉と玉を、同じ座標で。</h1><p>固定ケース・奥面・扉・玉を分離したドット絵サンプル</p></header><section class="workspace"><div class="visual"><div id="canvas"></div><div id="state" class="state"></div></div><aside><h2 id="step">待機</h2><p id="explanation"></p><dl><div><dt>発射</dt><dd id="shots">0</dd></div><div><dt>アタッカー入賞</dt><dd id="hits">0</dd></div><div><dt>OUT</dt><dd id="outs">0</dd></div></dl><button id="demo">20秒の実演を開始</button><div class="buttons"><button id="open">開く</button><button id="close">閉じる</button><button id="feed">発射 ON/OFF</button><button id="pause">一時停止</button></div><label><input id="guides" type="checkbox">判定線・玉の中心を表示</label><p class="note">既存Physicsの発射・重力・衝突・入賞判定を使用。拡大範囲の外にある発射口から玉を飛ばしています。</p><p class="note">扉は開放0.65秒・閉鎖0.5秒で下辺を軸に手前へ倒れます。全開の受け皿に接触した玉を取り込み、閉鎖中は下の坂へ流れます。抽選・賞球・保存を行わない独立した部品確認画面です。</p></aside></section></main><script type="module" src="/src/pixi/attacker-preview.js"></script></body></html>
