function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
document.querySelector('#save').onclick=()=>download(new Blob([JSON.stringify(project)],{type:'application/json'}),'step-face-grid-study.json');document.querySelector('#png').onclick=()=>preview.toBlob(b=>download(b,'step-face-grid-study.png'),'image/png');
document.querySelector('#load').onchange=async e=>{try{let p=JSON.parse(await e.target.files[0].text());if(p.width!==105||p.height!==70||!Array.isArray(p.palette)||!p.palette.length||!p.palette.every(c=>/^#[0-9a-f]{6}$/i.test(c))||!Array.isArray(p.pixels)||p.pixels.length!==7350||!p.pixels.every(n=>Number.isInteger(n)&&n>=0&&n<p.palette.length))throw Error('データの形式が違います');project=p;selected=0;history=[];colors();draw();msg.textContent='編集データを開きました'}catch(err){msg.textContent='読み込めません：'+err.message}e.target.value=''};colors();draw();
</script></body></html>
