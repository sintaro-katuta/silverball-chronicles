<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>盤面への玉の入り方</title><style>#canvas{aspect-ratio:384/320!important}</style></head><body><main><header><p>月影機関 / PIXIJS 部品試作</p><h1>枠の裏から、盤面へ。</h1><p>遊技中に見える範囲で、玉の入り方を確認</p></header><section class="workspace"><div class="visual"><div id="canvas"></div><div class="state">盤面上部 · 遊技者の視点</div></div><aside><h2>枠の向こうから玉が入る</h2><p>玉が上側の枠の裏から現れ、釘のある盤面へ流れていきます。</p><dl><div><dt>発射</dt><dd id="shots">0</dd></div><div><dt>表示範囲に入った玉</dt><dd id="escaped">0</dd></div></dl><button id="demo">20秒の実演を開始</button><div class="buttons"><button id="feed">発射 ON/OFF</button><button id="pause">一時停止</button></div><p class="note">玉の表示範囲を確かめる部品試作です。周囲の枠は確認用の簡易表示です。</p></aside></section></main><script type="module" src="/src/pixi/launcher-preview.js"></script></body></html>
