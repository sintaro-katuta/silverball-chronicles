<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>月影機関・右始動口接続試作</title></head><body><main><header><p>月影機関 / PIXIJS 部品試作</p><h1>右始動口：開いて、玉を導く。</h1><p>素材09を基準にした左右の銀羽根・金枠・青い電チュー</p></header><section class="workspace"><div class="visual"><div id="canvas"></div><div id="state" class="state"></div></div><aside><h2 id="step">待機</h2><p id="explanation"></p><dl><div><dt>発射</dt><dd id="shots">0</dd></div><div><dt>右始動口入賞</dt><dd id="hits">0</dd></div><div><dt>OUT</dt><dd id="outs">0</dd></div></dl><button id="electric">電チューの役割を実演（RUSH）</button><p id="electricStats" class="note"></p><button id="demo">20秒の実演を開始</button><div class="buttons"><button id="open">開く</button><button id="close">閉じる</button><button id="feed">発射 ON/OFF</button><button id="pause">一時停止</button></div><label><input id="guides" type="checkbox">判定線・玉の中心を表示</label><p class="note">既存Physicsの発射・重力・衝突・入賞判定を使用。拡大範囲の外にある発射口から玉を飛ばしています。</p><p class="note">0.4秒で左右の羽根が開閉します。固定本体の中央へ玉を導き、羽根の接触位置も表示と同期。電チュー実演では既存の抽選・保留・賞球に接続します。保存は行いません。</p></aside></section></main><script type="module" src="/src/pixi/right-start-preview.js"></script></body></html>
