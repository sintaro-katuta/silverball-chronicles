<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>月の満ち欠け × 色</title><style>body{margin:0;background:#08162b;color:#e8edf5;font:16px system-ui}main{max-width:800px;padding:22px;margin:auto}h1{font-size:23px}table{width:100%;border-collapse:collapse;text-align:center}th,td{padding:12px;border-bottom:1px solid #304359}canvas{width:100px;height:100px;image-rendering:pixelated}p{line-height:1.7}video{width:100%;max-height:76vh}a{color:#addcff}</style><main><h1>月：満ち欠け × 色の12通り</h1><p>指定した期待度を反映。同じ形で無色 → 緑 → 青 → 赤、同じ色で三日月 → 半月 → 満月。組み合わせ全体の強さは表の％に従います。通常の暗い月は予告なし、点灯した月が予告です。結果後の斬撃で赤くなる月は予告の期待度とは別です。</p><table><thead><tr><th>色／形</th><th>三日月</th><th>半月</th><th>満月</th></tr></thead><tbody id="rows"></tbody></table><h2>剣の振りと赤い月（6秒・MP4）</h2><video controls loop playsinline src="sword-slash.mp4"></video><p><a href="sword-slash.mp4" download>6秒のMP4</a> · <a href="motion.mp4" download>通しMP4</a></p></main><script type="module">import{createMoonCueArt}from'/src/pixi/moon-cue-art.js';import{MOON_PHASES,MOON_COLORS,MOON_COLOR_LABELS,MOON_EXPECTATIONS}from'/src/pixi/moon-cue.js';for(const [i,col]of MOON_COLORS.entries()){const tr=document.createElement('tr'),th=document.createElement('th');th.textContent=MOON_COLOR_LABELS[i];tr.append(th);for(const [j,p]of MOON_PHASES.entries()){const td=document.createElement('td');td.append(createMoonCueArt(p,col));const value=document.createElement('div');value.textContent=MOON_EXPECTATIONS[i][j]+'％';td.append(value);tr.append(td);}document.querySelector('#rows').append(tr);}window.__ready=true;</script></html>
