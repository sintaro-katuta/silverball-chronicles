<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>構えた剣と右の月</title><style>body{margin:0;background:#080f1b;color:#dfeaf5;font:15px system-ui}main{max-width:800px;margin:auto;padding:16px}h1{font-size:22px}h2{font-size:18px}p{line-height:1.7}video{display:block;width:100%;max-height:76vh;background:#080f1b}a{color:#a1d5ff}</style><main><h1>上向きの剣を構え、右の月へ振る</h1><p>キャラクターの肩近くの柄へ手を添え、上向きの剣を構える配置に変更。右端に三日月を復帰。上部の線を削除して夜空・雲・城の背景へ置換し、人物を虹色にしないよう発光対象から外しました。</p><h2>剣の構え・振り・復帰（6秒・MP4）</h2><video controls loop playsinline preload="metadata" src="sword-slash.mp4"></video><p><a href="sword-slash.mp4" download>6秒のMP4を保存</a></p><h2>全体から払出の序盤（約31秒・MP4）</h2><video controls playsinline preload="metadata" src="motion.mp4"></video><p><a href="motion.mp4" download>通しMP4を保存</a></p><p>等速・無音。約10秒で当選固定＋持ち玉を消費した実球1玉をヘソ直上へ配置する演出確認。その後は自然発射です。</p></main></html>
