<!doctype html><html lang="ja"><meta charset="utf-8"><style>body{margin:16px;background:#101b2d;color:#eee;font:16px sans-serif}main{display:grid;grid-template-columns:repeat(3,512px);gap:16px}figure{margin:0}canvas{display:block;background:repeating-conic-gradient(#1c2940 0% 25%,#162136 0% 50%) 0/24px 24px}</style><p>登録測定：赤＝握り／黄＝刀身先端／緑＝足元。線は測定の確認用で、ゲーム表示には含まれません。</p><main></main><script type="module">
const data=await fetch('./hair/registration.json').then(r=>r.json());
const images=await Promise.all([data.base,data.motion].map(name=>new Promise(resolve=>{const img=new Image();img.onload=()=>resolve(img);img.src='/assets/lcd/long-reach/'+name;})));
const params=new URLSearchParams(location.search);
for(const row of data.frames){const fig=document.createElement('figure'),label=document.createElement('figcaption'),c=document.createElement('canvas');c.width=c.height=512;label.textContent='frame '+row.frame;fig.append(label,c);document.querySelector('main').append(fig);const ctx=c.getContext('2d'),cell=row.frame%6;if(params.has('background')){ctx.fillStyle=params.get('background')==='sky'?'#a6daf5':'#000000';ctx.fillRect(0,0,512,512);}ctx.drawImage(images[Math.floor(row.frame/6)],cell%3*512,Math.floor(cell/3)*512,512,512,0,0,512,512);if(params.has('clean'))continue;ctx.lineWidth=1;ctx.strokeStyle='#48ed97';ctx.beginPath();ctx.moveTo(0,row.floor);ctx.lineTo(512,row.floor);ctx.stroke();for(const [p,color] of [[row.grip,'#ff5555'],[row.tip,'#ffff55']]){ctx.strokeStyle=color;ctx.beginPath();ctx.arc(...p,6,0,Math.PI*2);ctx.moveTo(p[0]-10,p[1]);ctx.lineTo(p[0]+10,p[1]);ctx.moveTo(p[0],p[1]-10);ctx.lineTo(p[0],p[1]+10);ctx.stroke();}}
</script></html>
