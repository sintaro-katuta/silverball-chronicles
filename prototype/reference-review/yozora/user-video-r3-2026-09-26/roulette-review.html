<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FAIR ルーレット型の試作</title><style>body{margin:0;background:#101319;color:#e7edf5;font:16px/1.7 system-ui}main{max-width:1600px;margin:auto;padding:24px}h1{font-size:26px}a{color:#8acfff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}figure{margin:0}img{width:100%;display:block}figcaption{padding:10px 0}p{max-width:1000px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style><main><h1>FAIR：ルーレット型の回転体</h1><p>6個の独立した筒を、一体の傾斜円盤・6つの入賞穴・放射状の区切りへ変更。中心軸を低くし、当り2区画を金色、残り4区画をアイボリーで表現しました。</p><div class="grid"><figure><img src="fair-after-oblique.png" alt="前の試作：独立した筒状の6ポケット"><figcaption>変更前：6個の筒が並ぶ形</figcaption></figure><figure><img src="fair-roulette-oblique.png" alt="今回：6つの穴のある一体の円盤と金色2区画"><figcaption>今回：ルーレット型の一体円盤</figcaption></figure></div><p>同じUnityカメラ・照明で描画。判定センサーの位置・当り区画数・回転速度・玉の経路は変更していません。今回変更したのは回転体の外観です。透明ケース、通路接続、台座、周辺装飾には前回確認した課題が残っています。</p><p><a href="fair-roulette-oblique.png">今回の接写を原寸で開く</a> ／ <a href="fair-comparison.html">実機との比較記録</a> ／ <a href="/sao-unity.html">ローカル遊技画面</a></p></main></html>
