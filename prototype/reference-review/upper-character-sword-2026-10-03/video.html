<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>上部キャラクターと剣の落下</title><style>body{margin:0;background:#080f1b;color:#dfeaf5;font:15px system-ui}main{max-width:800px;margin:auto;padding:16px}h1{font-size:22px}h2{font-size:18px}p{line-height:1.7}video{display:block;width:100%;max-height:76vh;background:#080f1b}a{color:#a1d5ff}</style><main><h1>上部：キャラクターと左下向きの剣</h1><p>仮面を液晶と同じ銀髪の騎士へ、手を下向きの剣へ変更。中央の月を撤去しました。人物と枠の位置は固定し、当たり時に剣だけがガクッと落ち、反動の後に収納位置へ戻ります。</p><h2>剣の落下・復帰（6秒・等速）</h2><video controls loop playsinline preload="metadata" src="sword-drop.mp4"></video><h2>全体から払出の序盤まで（約31秒）</h2><video controls playsinline preload="metadata" src="motion.mp4"></video><p>無音・等速。動作確認用に約10秒で当選を固定し、持ち玉を消費した実球1玉をヘソ直上へ配置。その後の玉は自然発射です。</p><p><a href="normal-desktop.png">通常時の画像</a> · <a href="sword-drop.mp4" download>落下動画を保存</a></p></main></html>
