<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1080"><rect width="1280" height="1080" fill="#071421"/><text x="30" y="65" font-family="sans-serif" font-size="36" fill="#fff">3枚羽根と丸い中央：形状修正の試作結果</text><text x="30" y="130" font-family="sans-serif" font-size="29" fill="#e5f1fa">同じ開始条件0／各250発停止＋45秒排出の全結果</text><text x="30" y="550" font-family="sans-serif" font-size="28" fill="#e5f1fa">返却・残球・滞留・液晶侵入4区分：両側すべて0</text><text x="30" y="615" font-family="sans-serif" font-size="27" fill="#e5f1fa">最長無ヘソ：30.93 → 70.19秒（発射中152.916秒の観測）</text><text x="30" y="700" font-family="sans-serif" font-size="29" fill="#ffcfab">ヘソが減少したため、性能改善として不採用。追加3条件なし。</text><text x="30" y="750" font-family="sans-serif" font-size="27" fill="#e5f1fa">目標の3条件750発・ヘソ60以上と各条件非悪化は未達。</text><text x="30" y="825" font-family="sans-serif" font-size="25" fill="#e5f1fa">元101釘・左上狙い・風車中心・球・レール・係数は固定。</text><text x="30" y="870" font-family="sans-serif" font-size="24" fill="#e5f1fa">両側とも受けガイド・取付板なし。旧ガイド付き15/250は別履歴。</text><text x="30" y="925" font-family="sans-serif" font-size="23" fill="#e5f1fa">3羽根＋真円hubは共通接触形状。前面円盤は表示のみ・全面壁ではありません。</text><text x="30" y="978" font-family="sans-serif" font-size="23" fill="#e5f1fa">写真と同型・実寸・奥行の完全再現は未確認。本編の既定は切り替えていません。</text><text x="30" y="1035" font-family="sans-serif" font-size="23" fill="#e5f1fa">無音の保存座標リプレイ資料／新しい音声・追加試射なし</text><text x="30" y="220" font-family="sans-serif" font-size="30" fill="#e5f1fa">比較</text><text x="30" y="290" font-family="sans-serif" font-size="30" fill="#e5f1fa">実発射</text><text x="30" y="350" font-family="sans-serif" font-size="30" fill="#e5f1fa">ヘソ入賞</text><text x="30" y="410" font-family="sans-serif" font-size="30" fill="#e5f1fa">一般入賞</text><text x="30" y="470" font-family="sans-serif" font-size="30" fill="#e5f1fa">OUT</text><text x="450" y="220" font-family="sans-serif" font-size="30" fill="#e5f1fa">変更前</text><text x="840" y="220" font-family="sans-serif" font-size="30" fill="#e5f1fa">修正案</text><text x="450" y="290" font-family="sans-serif" font-size="30" fill="#e5f1fa">250</text><text x="840" y="290" font-family="sans-serif" font-size="30" fill="#e5f1fa">250</text><text x="450" y="350" font-family="sans-serif" font-size="30" fill="#e5f1fa">13</text><text x="840" y="350" font-family="sans-serif" font-size="30" fill="#e5f1fa">9</text><text x="450" y="410" font-family="sans-serif" font-size="30" fill="#e5f1fa">3</text><text x="840" y="410" font-family="sans-serif" font-size="30" fill="#e5f1fa">4</text><text x="450" y="470" font-family="sans-serif" font-size="30" fill="#e5f1fa">234</text><text x="840" y="470" font-family="sans-serif" font-size="30" fill="#e5f1fa">237</text></svg>