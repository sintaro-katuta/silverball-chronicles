<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#071421"/><g font-family="sans-serif" fill="#e3eef6"><text x="28" y="48" font-size="31">新写真からの1案：丸い中央と3枚羽根／前面の円盤は別層</text><text x="28" y="88" font-size="20">設計試作・未実装／実寸mm未校正／写真と特許の型式一致・厚さ・接触断面は未確認</text><rect x="20" y="120" width="510" height="530" rx="10" fill="#102534"/><rect x="545" y="120" width="510" height="530" rx="10" fill="#102534"/><rect x="1070" y="120" width="510" height="530" rx="10" fill="#102534"/><text x="40" y="160" font-size="23">可視案（前面円盤は透過表現）</text><polygon points="322.19774012658235,348.50080829423456 369.34287093402384,362.94203889100953 429.5373119748355,393.5178752292726 431.854769396146,403.9131573851553 428.566137178233,415.34971710105344 421.08082912877364,422.9261716415822 353.83931904957706,416.85724898024375 306.22438363957656,404.0498126285971" fill="#f1f0e8"/><polygon points="265.6898490958112,414.1240378037192 229.61081113337426,447.7323034493164 173.03413960207726,484.57430038813243 162.87283246492055,481.38363630923476 154.61279732801142,472.81731740686905 151.7940492500253,462.54662321062074 190.6706454879457,407.3482286238783 225.56967843082424,372.51620313508596" fill="#f1f0e8"/><polygon points="237.11241077760644,332.37515390204624 226.0463179326019,284.32565765967405 222.42854842308725,216.90782438259504 230.27239813893348,209.70320630561002 241.82106549375553,206.83296549207753 252.12512162120106,209.52720514779713 280.49003546247724,270.79452239587795 293.2059379295992,318.4339842363169" fill="#f1f0e8"/><circle cx="275" cy="365" r="59.5" fill="#e0e4e7"/><circle cx="275" cy="365" r="170" fill="#dce7ed" fill-opacity=".12" stroke="#e8c870" stroke-width="7"/><circle cx="275" cy="365" r="3.4000000000000004" fill="#142b38"/><text x="40" y="580" font-size="19">3羽根120°・中央は丸いローター同体</text><text x="40" y="615" font-size="18">円盤外径は従来の可視範囲R10を維持</text><text x="565" y="160" font-size="23">接触案（青い羽根＋中央のみ）</text><polygon points="847.1977401265823,348.50080829423456 894.3428709340238,362.94203889100953 954.5373119748356,393.5178752292726 956.854769396146,403.9131573851553 953.566137178233,415.34971710105344 946.0808291287736,422.9261716415822 878.839319049577,416.85724898024375 831.2243836395766,404.0498126285971" fill="#70dbe5"/><polygon points="790.6898490958113,414.1240378037192 754.6108111333742,447.7323034493164 698.0341396020773,484.57430038813243 687.8728324649205,481.38363630923476 679.6127973280114,472.81731740686905 676.7940492500253,462.54662321062074 715.6706454879456,407.3482286238783 750.5696784308242,372.51620313508596" fill="#70dbe5"/><polygon points="762.1124107776064,332.37515390204624 751.0463179326019,284.32565765967405 747.4285484230872,216.90782438259504 755.2723981389335,209.70320630561002 766.8210654937556,206.83296549207753 777.1251216212011,209.52720514779713 805.4900354624772,270.79452239587795 818.2059379295991,318.4339842363169" fill="#70dbe5"/><circle cx="800" cy="365" r="59.5" fill="#70dbe5"/><text x="565" y="580" font-size="19">羽根先R9.5・丸hub R3.5（比率は仮）</text><text x="565" y="615" font-size="18">円盤外周は表示のみ。全円solidにしない</text><text x="1090" y="160" font-size="23">前後層の構成案（縮尺のない模式図）</text><path d="M1130 245V450" stroke="#8097a4" stroke-width="14"/><rect x="1195" y="288" width="55" height="125" rx="5" fill="#f1f0e8"/><circle cx="1207" cy="250" r="25" fill="#b9d0dc"/><path d="M1310 225V460" stroke="#e8c870" stroke-width="8" stroke-opacity=".65"/><text x="1100" y="510" font-size="18">盤面 → 羽根・玉の層 → 前面円盤 → ガラス</text><text x="1090" y="556" font-size="17">球は羽根Spriteの前、透過plateの後へ。</text><text x="1090" y="584" font-size="17">層順は別Spriteと実画面で照合します。</text><text x="1090" y="613" font-size="17">厚み・球の奥行断面を測った図ではありません。</text><text x="28" y="702" font-size="23">固定：元101釘・左上狙い・中心(64,476.5)・球R1.8と物理・発射・レール・口20</text><text x="28" y="746" font-size="21">比較の両側をヘソガイド/取付板なしへ統一。旧4羽根・固定菱形案は履歴、試射なし。</text><text x="28" y="790" font-size="21">次：比率/層の静止確認 → 共有shapeと接触 → fresh同条件250発。入賞増はまだ不明です。</text><text x="28" y="852" font-size="17">根拠：提供写真BF6CECBE…、JP2009112334A図1（別型式の構造例）。写真/特許の画像は製品素材へ転載しません。</text></g></svg>