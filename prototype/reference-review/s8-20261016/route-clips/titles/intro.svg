<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1080"><rect width="1280" height="1080" fill="#071421"/><text x="70" y="200" font-family="Hiragino Sans, sans-serif" font-size="54" fill="#ffffff">元配置250発の流れを確認</text><text x="70" y="310" font-family="Hiragino Sans, sans-serif" font-size="44" fill="#ffffff">ヘソ15 ／ 一般6 ／ OUT229</text><text x="70" y="440" font-family="Hiragino Sans, sans-serif" font-size="36" fill="#ffffff">OUT203球には、道釘の反発・押し戻しがない</text><text x="70" y="530" font-family="Hiragino Sans, sans-serif" font-size="30" fill="#ffffff">釘・風車・玉・物理の設定は変えていません。</text><text x="70" y="690" font-family="Hiragino Sans, sans-serif" font-size="30" fill="#ffffff">代表球の実座標を再生します。</text><text x="70" y="750" font-family="Hiragino Sans, sans-serif" font-size="30" fill="#ffffff">左：実際の盤面 ／ 右：細かい記録による計測図</text><text x="70" y="810" font-family="Hiragino Sans, sans-serif" font-size="28" fill="#ffffff">低速再生の倍率と実時刻を画面に表示しています。</text><text x="70" y="1000" font-family="Hiragino Sans, sans-serif" font-size="23" fill="#b8ccd9">無音の観測資料 ／ 改善結果や原因確定の映像ではありません。</text></svg>