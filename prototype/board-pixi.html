<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>盤面部品の統合確認</title><style>.workspace{grid-template-columns:546px 1fr!important;gap:24px!important}#canvas{aspect-ratio:420/560!important}.visual{width:546px}@media(max-width:800px){.workspace{grid-template-columns:1fr!important}.visual{width:100%}}</style></head><body><main><header><p>月影機関 / PIXIJS 盤面試作</p><h1>確定した部品を、一つの盤面へ。</h1><p>同じ銀玉を基準に、大きさ・配置・重なりを確認</p></header><section class="workspace"><div class="visual"><div id="canvas"></div><div class="state" id="phase">通常打ち</div></div><aside><h2>盤面全体で玉を流す</h2><p>通常打ち → 電チュー → アタッカーを12秒ずつ実演します。</p><dl><div><dt>発射</dt><dd id="shots">0</dd></div><div><dt>中央始動口</dt><dd id="start">0</dd></div><div><dt>通常入賞口</dt><dd id="normal">0</dd></div><div><dt>電チュー</dt><dd id="rush">0</dd></div><div><dt>アタッカー</dt><dd id="bonus">0</dd></div><div><dt>OUT</dt><dd id="out">0</dd></div></dl><button id="demo">36秒の通し実演</button><div class="buttons"><button id="mode-normal">通常打ち</button><button id="mode-rush">電チュー</button><button id="mode-bonus">アタッカー</button><button id="feed">発射 ON/OFF</button><button id="pause">一時停止</button></div><p class="note">盤面部品の統合試作です。液晶・背景・筐体装飾はまだ組み込んでいません。開放は確認用の手動切替で、抽選・賞球・保存は接続していません。</p></aside></section></main><script type="module" src="/src/pixi/board-preview.js"></script></body></html>
